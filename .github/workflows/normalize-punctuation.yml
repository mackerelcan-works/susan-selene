name: Normalize Susan Selene punctuation

on:
  push:
    branches:
      - hipgnosis-preview
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: hipgnosis-preview

      - name: Normalize Japanese commas
        shell: python
        run: |
          from pathlib import Path

          targets = [
              Path('index.html'),
              Path('taiyo/index.html'),
              Path('hipgnosis/index.html'),
          ]
          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = text.replace('、', '，')
              path.write_text(text, encoding='utf-8')

      - name: Commit normalized punctuation
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No punctuation changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html taiyo/index.html hipgnosis/index.html
          git commit -m "Normalize Susan Selene punctuation"
          git push origin HEAD:hipgnosis-preview
